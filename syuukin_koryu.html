<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打ち上げ集金管理システム</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .info-box p {
            margin: 5px 0;
            color: #555;
        }

        .info-box strong {
            color: #333;
        }

        .qr-container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            margin: 20px 0;
        }

        #qrcode {
            display: inline-block;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }

        #qrcode canvas,
        #qrcode img {
            max-width: 100%;
            height: auto;
        }

        .qr-instruction {
            margin-top: 15px;
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
        }

        #qr-reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #667eea;
            border-radius: 8px;
            overflow: hidden;
        }

        .scanner-container {
            margin: 20px 0;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-badges {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.completed {
            background: #d4edda;
            color: #155724;
        }

        .badge.pending {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .password-modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn.confirm {
            background: #667eea;
            color: white;
        }

        .modal-btn.cancel {
            background: #e0e0e0;
            color: #555;
        }

        .modal-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .scan-result {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .scan-result h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .scan-info {
            margin: 10px 0;
            color: #555;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn.primary {
            background: #28a745;
            color: white;
        }

        .action-btn.secondary {
            background: #6c757d;
            color: white;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .hidden {
            display: none !important;
        }

        .debug-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            font-size: 12px;
            color: #856404;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎉 打ち上げ集金管理システム</h1>

        <!-- モード切り替えボタン -->
        <div class="mode-switch">
            <button class="mode-btn active" onclick="switchMode('participant')">
                👤 参加者モード
            </button>
            <button class="mode-btn" onclick="switchMode('admin')">
                🔑 幹事モード
            </button>
        </div>

        <!-- ローディング表示 -->
        <div id="loading" class="loading hidden">
            <p>読み込み中...</p>
        </div>

        <!-- 参加者モード -->
        <div id="participantSection" class="section active">
            <div class="form-group">
                <label for="gradeSelect">学年を選択してください</label>
                <select id="gradeSelect" onchange="filterByGrade()">
                    <option value="">学年を選択</option>
                </select>
                <label for="participantSelect">あなたの名前を選択してください</label>
                <select id="participantSelect" onchange="selectParticipant()">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div id="participantInfo" class="hidden">
                <div class="info-box">
                    <p><strong>名前:</strong> <span id="participantName"></span></p>
                </div>

                <div id="currentStatus"></div>

                <div id="qrCodeSection" class="qr-container hidden">
                    <div id="qrcode"></div>
                    <p class="qr-instruction">👆 このQRコードを幹事に見せてください</p>
                </div>
            </div>
        </div>

        <!-- 幹事モード -->
        <div id="adminSection" class="section">
            <div class="scanner-container">
                <h3 style="margin-bottom: 15px; color: #333;">📱 QRコードをスキャン</h3>
                <div id="qr-reader"></div>
            </div>

            <div id="scanResult" class="scan-result hidden">
                <h3>スキャン結果</h3>
                <p class="scan-info"><strong>名前:</strong> <span id="scannedName"></span></p>
                <p class="scan-info"><strong>学年:</strong> <span id="scannedGrade"></span></p>

                <div class="action-buttons">
                    <button class="action-btn primary" onclick="confirmPayment()">✅ 回収完了</button>
                    <button class="action-btn secondary" onclick="cancelScan()">❌ キャンセル</button>
                </div>
            </div>

            <div id="adminStatus"></div>
        </div>

        <!-- パスワードモーダル -->
        <div id="passwordModal" class="password-modal">
            <div class="modal-content">
                <h2>🔐 パスワード入力</h2>
                <input type="password" id="passwordInput" placeholder="パスワードを入力">
                <div class="modal-buttons">
                    <button class="modal-btn cancel" onclick="cancelPasswordModal()">キャンセル</button>
                    <button class="modal-btn confirm" onclick="confirmPassword()">確認</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 設定 =====
        const CONFIG = {
            SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzFCpjMY0cKvK46-bIWMD04KWcKbDKHnKoTutDUs7h3xNkiOvRG-uE9Yv7UVW5_znLI/exec',
            ADMIN_PASSWORD: 'admin123'
        };

        // ===== 列インデックス定義（0始まり）=====
        // A=0, B=1, C=2, D=3, E=4, F=5, G=6, H=7, I=8, J=9
        const COL = {
            NAME: 3,        // D列: 名前
            GRADE: 6,       // G列: 学年
            STATUS: 9       // J列: 回収状況
        };

        // ===== グローバル変数 =====
        let spreadsheetData = [];
        let qrScanner = null;
        let scannedData = null;

        // ===== 初期化 =====
        async function init() {
            console.log('システム初期化開始');
            await loadSpreadsheetData();
        }

        // ===== スプレッドシートデータ読み込み =====
        async function loadSpreadsheetData() {
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');

            try {
                const url = `${CONFIG.SCRIPT_URL}?action=getData&t=${Date.now()}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || 'データの取得に失敗しました');
                }

                spreadsheetData = result.data;

                // デバッグ：1行目（ヘッダー）と2行目を確認
                if (spreadsheetData.length > 0) {
                    console.log('ヘッダー行:', spreadsheetData[0]);
                }
                if (spreadsheetData.length > 1) {
                    console.log('データ1行目:', spreadsheetData[1]);
                    console.log('D列(インデックス3):', spreadsheetData[1][COL.NAME]);
                    console.log('G列(インデックス6):', spreadsheetData[1][COL.GRADE]);
                }

                populateGradeList();

            } catch (error) {
                console.error('データ読み込みエラー:', error);
                alert('データの読み込みに失敗しました: ' + error.message);
            } finally {
                loading.classList.add('hidden');
            }
        }

        // ===== 学年リスト作成 =====
        function populateGradeList() {
            const gradeSelect = document.getElementById('gradeSelect');
            gradeSelect.innerHTML = '<option value="">学年を選択</option>';

            const grades = new Set();

            for (let i = 1; i < spreadsheetData.length; i++) {
                const grade = spreadsheetData[i][COL.GRADE];
                if (grade !== undefined && grade !== null && grade !== '') {
                    grades.add(String(grade));
                }
            }

            console.log('取得した学年一覧:', [...grades]);

            grades.forEach(grade => {
                const option = document.createElement('option');
                option.value = grade;
                option.textContent = grade;
                gradeSelect.appendChild(option);
            });
        }

        // ===== 学年で絞り込み =====
        function filterByGrade() {
            const selectedGrade = document.getElementById('gradeSelect').value;
            const nameSelect = document.getElementById('participantSelect');

            nameSelect.innerHTML = '<option value="">選択してください</option>';
            document.getElementById('participantInfo').classList.add('hidden');

            if (!selectedGrade) return;

            let count = 0;
            for (let i = 1; i < spreadsheetData.length; i++) {
                const grade = String(spreadsheetData[i][COL.GRADE] || '');
                const name = spreadsheetData[i][COL.NAME] || '';

                console.log(`行${i}: grade="${grade}", name="${name}", 一致=${grade === selectedGrade}`);

                if (grade === selectedGrade && name !== '') {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = name;
                    nameSelect.appendChild(option);
                    count++;
                }
            }

            console.log(`学年"${selectedGrade}"の参加者: ${count}人`);
        }

        // ===== 参加者選択 =====
        function selectParticipant() {
            const select = document.getElementById('participantSelect');
            const rowIndex = parseInt(select.value);

            if (isNaN(rowIndex) || !rowIndex) {
                document.getElementById('participantInfo').classList.add('hidden');
                return;
            }

            const row = spreadsheetData[rowIndex];
            const name = row[COL.NAME] || '';
            const completed = row[COL.STATUS] || '';

            document.getElementById('participantName').textContent = name;

            // 状態表示
            const statusDiv = document.getElementById('currentStatus');
            if (completed === '回収完了') {
                statusDiv.innerHTML = '<div class="status-badges"><span class="badge completed">✅ 回収完了</span></div>';
            } else {
                statusDiv.innerHTML = '<div class="status-badges"><span class="badge pending">⏳ 未回収</span></div>';
            }

            // QRコード生成
            generateQRCode(rowIndex);

            document.getElementById('participantInfo').classList.remove('hidden');
        }

        // ===== QRコード生成 =====
        function generateQRCode(rowIndex) {
            try {
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = '';

                new QRCode(qrContainer, {
                    text: String(rowIndex),
                    width: 250,
                    height: 250,
                    correctLevel: QRCode.CorrectLevel.M
                });

                document.getElementById('qrCodeSection').classList.remove('hidden');

            } catch (error) {
                console.error('QRコード生成エラー:', error);
                alert('QRコードの生成に失敗しました: ' + error.message);
            }
        }

        // ===== モード切り替え =====
        function switchMode(mode) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            if (mode === 'participant') {
                document.getElementById('participantSection').classList.add('active');
                document.getElementById('adminSection').classList.remove('active');
                buttons[0].classList.add('active');
                stopQRScanner();
            } else {
                document.getElementById('passwordModal').classList.add('active');
            }
        }

        // ===== パスワードモーダル =====
        function cancelPasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.querySelectorAll('.mode-btn')[0].classList.add('active');
        }

        function confirmPassword() {
            const password = document.getElementById('passwordInput').value;

            if (password === CONFIG.ADMIN_PASSWORD) {
                document.getElementById('passwordModal').classList.remove('active');
                document.getElementById('passwordInput').value = '';
                document.getElementById('participantSection').classList.remove('active');
                document.getElementById('adminSection').classList.add('active');
                document.querySelectorAll('.mode-btn')[1].classList.add('active');
                startQRScanner();
            } else {
                alert('パスワードが正しくありません');
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') confirmPassword();
        });

        // ===== QRスキャナー =====
        function startQRScanner() {
            if (qrScanner) return;

            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error('QRスキャナーの起動に失敗:', err);
                alert('カメラへのアクセスが拒否されました。ブラウザの設定でカメラの使用を許可してください。');
            });
        }

        function stopQRScanner() {
            if (qrScanner) {
                qrScanner.stop().then(() => {
                    qrScanner = null;
                }).catch(err => console.error('スキャナー停止エラー:', err));
            }
        }

        // ===== QRコードスキャン成功 =====
        function onScanSuccess(decodedText) {
            try {
                const rowIndex = parseInt(decodedText);

                if (isNaN(rowIndex) || rowIndex < 1 || rowIndex >= spreadsheetData.length) {
                    throw new Error('無効なQRコードです');
                }

                const participant = spreadsheetData[rowIndex];
                const name = participant[COL.NAME] || '';
                const grade = participant[COL.GRADE] || '不明';

                scannedData = { rowIndex, name, grade };

                document.getElementById('scannedName').textContent = name;
                document.getElementById('scannedGrade').textContent = grade;
                document.getElementById('scanResult').classList.remove('hidden');

                if (qrScanner) qrScanner.pause();

            } catch (error) {
                console.error('スキャンエラー:', error);
                alert('QRコードの読み取りに失敗しました: ' + error.message);
            }
        }

        function onScanFailure(error) { /* 正常な動作 */ }

        // ===== 回収完了 =====
        async function confirmPayment() {
            if (!scannedData) return;
            await markAsCompleted(scannedData.rowIndex, scannedData.name);
            document.getElementById('scanResult').classList.add('hidden');
            scannedData = null;
            if (qrScanner) qrScanner.resume();
        }

        function cancelScan() {
            document.getElementById('scanResult').classList.add('hidden');
            scannedData = null;
            if (qrScanner) qrScanner.resume();
        }

        async function markAsCompleted(rowIndex, name) {
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');

            try {
                const url = `${CONFIG.SCRIPT_URL}?action=updateCell&row=${rowIndex + 1}&col=J&value=${encodeURIComponent('回収完了')}&t=${Date.now()}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const result = await response.json();
                if (!result.success) throw new Error(result.error || '更新に失敗しました');

                document.getElementById('adminStatus').innerHTML =
                    `<div class="status success">✅ ${name}さんの回収を完了しました</div>`;

                await loadSpreadsheetData();

                setTimeout(() => {
                    document.getElementById('adminStatus').innerHTML = '';
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('adminStatus').innerHTML =
                    `<div class="status error">❌ 更新に失敗しました: ${error.message}</div>`;
            } finally {
                loading.classList.add('hidden');
            }
        }

        window.onload = init;
    </script>
</body>

</html>
