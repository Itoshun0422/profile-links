<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打ち上げ集金管理システム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .info-box p {
            margin: 5px 0;
            color: #555;
        }

        .info-box strong {
            color: #333;
        }

        .amount {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }

        .qr-container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            margin: 20px 0;
        }

        #qrcode {
            display: inline-block;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }

        .qr-instruction {
            margin-top: 15px;
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
        }

        #qr-reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .scanner-container {
            margin: 20px 0;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.completed {
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        .status-badges {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.completed {
            background: #fff3cd;
            color: #856404;
        }

        .badge.pending {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .password-modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn.confirm {
            background: #667eea;
            color: white;
        }

        .modal-btn.cancel {
            background: #e0e0e0;
            color: #555;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 打ち上げ集金管理システム</h1>

        <div class="mode-switch">
            <button class="mode-btn active" onclick="switchMode('participant')">参加者モード</button>
            <button class="mode-btn" onclick="switchMode('admin')">幹事モード</button>
        </div>

        <!-- 参加者モード -->
        <div id="participantSection" class="section active">
            <div class="form-group">
                <label for="gradeSelect">学年を選択</label>
                <select id="gradeSelect" onchange="loadNamesByGrade()">
                    <option value="">-- 学年を選択してください --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nameSelect">名前を選択</label>
                <select id="nameSelect" onchange="showQRCode()">
                    <option value="">-- 名前を選択してください --</option>
                </select>
            </div>

            <div id="participantInfo" class="info-box" style="display:none;">
                <p><strong>参加区分:</strong> <span id="participationType"></span></p>
                <p><strong>支払い方法:</strong> <span id="paymentMethod"></span></p>
                <p><strong>金額:</strong> <span class="amount" id="amount"></span></p>
                <div id="currentStatus"></div>
            </div>

            <div id="qrCodeSection" style="display:none;">
                <div class="qr-container">
                    <div id="qrcode"></div>
                    <p class="qr-instruction">👆 このQRコードを幹事に見せてください</p>
                </div>
            </div>

            <div id="participantStatus"></div>
        </div>

        <!-- 幹事モード -->
        <div id="adminSection" class="section">
            <div class="scanner-container">
                <h2 style="color: #333; margin-bottom: 15px;">QRコードをスキャン</h2>
                <div id="qr-reader"></div>
            </div>

            <div id="scanResult" style="display:none;" class="info-box">
                <h3 style="color: #333; margin-bottom: 10px;">スキャン結果</h3>
                <p><strong>名前:</strong> <span id="scannedName"></span></p>
                <p><strong>学年:</strong> <span id="scannedGrade"></span></p>
                <p><strong>参加区分:</strong> <span id="scannedType"></span></p>
                <p><strong>支払い方法:</strong> <span id="scannedPayment"></span></p>
                <p><strong>金額:</strong> <span class="amount" id="scannedAmount"></span></p>
            </div>

            <div id="adminStatus"></div>
        </div>

        <div id="loading" class="loading" style="display:none;">
            読み込み中...
        </div>
    </div>

    <!-- パスワードモーダル -->
    <div id="passwordModal" class="password-modal">
        <div class="modal-content">
            <h2>幹事パスワード</h2>
            <div class="form-group">
                <label for="passwordInput">パスワードを入力してください</label>
                <input type="password" id="passwordInput" placeholder="パスワード">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="cancelPasswordModal()">キャンセル</button>
                <button class="modal-btn confirm" onclick="confirmPassword()">確認</button>
            </div>
        </div>
    </div>

    <script>
        // 設定
        const CONFIG = {
            SCRIPT_URL: 'YOUR_APPS_SCRIPT_URL', // ここにGoogle Apps ScriptのウェブアプリURLを入力
            ADMIN_PASSWORD: 'admin123'          // 幹事パスワード
        };

        let spreadsheetData = [];
        let priceSettings = {};
        let qrScanner = null;
        let currentQRCode = null;

        // 初期化
        async function init() {
            await loadSpreadsheetData();
        }

        // スプレッドシートからデータを読み込む
        async function loadSpreadsheetData() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            try {
                const response = await fetch(CONFIG.SCRIPT_URL + '?action=getData');
                const data = await response.json();
                
                if (data.success) {
                    spreadsheetData = data.data;
                    
                    // 金額設定を読み込む (O2, P2, Q2)
                    if (spreadsheetData.length > 1) {
                        const row2 = spreadsheetData[1];
                        
                        priceSettings = {
                            '打ち上げのみ参加する': row2[14] ? String(row2[14]) : '未設定',
                            '二次会のみ参加する': row2[15] ? String(row2[15]) : '未設定',
                            '打ち上げと二次会に参加する': row2[16] ? String(row2[16]) : '未設定'
                        };
                    }
                    
                    loadGrades();
                } else {
                    alert('データの読み込みに失敗しました: ' + data.error);
                }
            } catch (error) {
                console.error('Error loading data:', error);
                alert('データの読み込みに失敗しました。Apps ScriptのURLを確認してください。');
            } finally {
                loading.style.display = 'none';
            }
        }

        // 学年一覧を読み込む
        function loadGrades() {
            const gradeSelect = document.getElementById('gradeSelect');
            const grades = new Set();
            
            for (let i = 1; i < spreadsheetData.length; i++) {
                const grade = spreadsheetData[i][6];
                if (grade) {
                    grades.add(grade);
                }
            }
            
            gradeSelect.innerHTML = '<option value="">-- 学年を選択してください --</option>';
            Array.from(grades).sort().forEach(grade => {
                const option = document.createElement('option');
                option.value = grade;
                option.textContent = grade;
                gradeSelect.appendChild(option);
            });
        }

        // 学年ごとの名前一覧を読み込む
        function loadNamesByGrade() {
            const grade = document.getElementById('gradeSelect').value;
            const nameSelect = document.getElementById('nameSelect');
            
            nameSelect.innerHTML = '<option value="">-- 名前を選択してください --</option>';
            document.getElementById('participantInfo').style.display = 'none';
            document.getElementById('qrCodeSection').style.display = 'none';
            
            if (!grade) return;
            
            for (let i = 1; i < spreadsheetData.length; i++) {
                if (spreadsheetData[i][6] === grade) {
                    const name = spreadsheetData[i][1];
                    if (name) {
                        const option = document.createElement('option');
                        option.value = i;
                        option.textContent = name;
                        nameSelect.appendChild(option);
                    }
                }
            }
        }

        // QRコードを表示
        function showQRCode() {
            const rowIndex = document.getElementById('nameSelect').value;
            
            if (!rowIndex) {
                document.getElementById('participantInfo').style.display = 'none';
                document.getElementById('qrCodeSection').style.display = 'none';
                return;
            }
            
            const row = spreadsheetData[rowIndex];
            const name = row[1] || '';
            const participationType = row[2] || '';
            const paymentMethod = row[3] || '';
            const grade = row[6] || '';
            const completed = row[9] || '';
            
            document.getElementById('participationType').textContent = participationType;
            document.getElementById('paymentMethod').textContent = paymentMethod;
            
            let price = priceSettings[participationType] || '未設定';
            document.getElementById('amount').textContent = price;
            
            // 状態表示
            const statusDiv = document.getElementById('currentStatus');
            let statusHtml = '<div class="status-badges">';
            
            if (completed === '回収完了') {
                statusHtml += '<span class="badge completed">✅ 回収完了</span>';
            } else {
                statusHtml += '<span class="badge pending">未完了</span>';
            }
            
            statusHtml += '</div>';
            statusDiv.innerHTML = statusHtml;
            
            document.getElementById('participantInfo').style.display = 'block';
            
            // QRコード生成
            const qrData = JSON.stringify({
                rowIndex: parseInt(rowIndex) + 1, // スプレッドシートの行番号
                name: name,
                grade: grade,
                participationType: participationType,
                paymentMethod: paymentMethod,
                amount: price
            });
            
            // 既存のQRコードをクリア
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            // 新しいQRコードを生成
            new QRCode(qrcodeDiv, {
                text: qrData,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            document.getElementById('qrCodeSection').style.display = 'block';
        }

        // モード切り替え
        function switchMode(mode) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (mode === 'participant') {
                document.getElementById('participantSection').classList.add('active');
                document.getElementById('adminSection').classList.remove('active');
                buttons[0].classList.add('active');
                
                // QRスキャナーを停止
                if (qrScanner) {
                    qrScanner.stop();
                }
            } else {
                // 幹事モードはパスワード確認
                document.getElementById('passwordModal').classList.add('active');
            }
        }

        // パスワードモーダル
        function cancelPasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            const buttons = document.querySelectorAll('.mode-btn');
            buttons[0].classList.add('active');
            buttons[1].classList.remove('active');
        }

        function confirmPassword() {
            const password = document.getElementById('passwordInput').value;
            
            if (password === CONFIG.ADMIN_PASSWORD) {
                document.getElementById('passwordModal').classList.remove('active');
                document.getElementById('passwordInput').value = '';
                document.getElementById('participantSection').classList.remove('active');
                document.getElementById('adminSection').classList.add('active');
                document.querySelectorAll('.mode-btn')[1].classList.add('active');
                
                // QRスキャナーを開始
                startQRScanner();
            } else {
                alert('パスワードが正しくありません');
            }
        }

        // QRスキャナーを開始
        function startQRScanner() {
            const qrReaderDiv = document.getElementById('qr-reader');
            
            qrScanner = new Html5Qrcode("qr-reader");
            
            qrScanner.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error('QRスキャナーの起動に失敗:', err);
                alert('カメラへのアクセスが拒否されました。ブラウザの設定を確認してください。');
            });
        }

        // QRコードスキャン成功時
        async function onScanSuccess(decodedText, decodedResult) {
            try {
                const data = JSON.parse(decodedText);
                
                // スキャン結果を表示
                document.getElementById('scannedName').textContent = data.name;
                document.getElementById('scannedGrade').textContent = data.grade;
                document.getElementById('scannedType').textContent = data.participationType;
                document.getElementById('scannedPayment').textContent = data.paymentMethod;
                document.getElementById('scannedAmount').textContent = data.amount;
                document.getElementById('scanResult').style.display = 'block';
                
                // スキャナーを一時停止
                qrScanner.pause();
                
                // 回収完了を記録
                await markAsCompleted(data.rowIndex, data.name);
                
                // 3秒後にスキャナーを再開
                setTimeout(() => {
                    document.getElementById('scanResult').style.display = 'none';
                    qrScanner.resume();
                }, 3000);
                
            } catch (error) {
                console.error('QRコードの解析エラー:', error);
            }
        }

        // QRコードスキャン失敗時（エラーメッセージは表示しない）
        function onScanFailure(error) {
            // スキャン失敗は正常な動作なので何もしない
        }

        // 回収完了を記録
        async function markAsCompleted(rowIndex, name) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                // J列に「回収完了」を書き込む
                const url = CONFIG.SCRIPT_URL + 
                    '?action=updateCell' +
                    '&row=' + rowIndex +
                    '&col=J' +
                    '&value=' + encodeURIComponent('回収完了');
                
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors'
                });
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                document.getElementById('adminStatus').innerHTML = 
                    `<div class="status success">✅ ${name}さんの回収を完了しました</div>`;
                
                // データ再読み込み
                await loadSpreadsheetData();
                
                setTimeout(() => {
                    document.getElementById('adminStatus').innerHTML = '';
                }, 3000);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('adminStatus').innerHTML = 
                    '<div class="status error">❌ 更新に失敗しました</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        // Enterキーでパスワード確認
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                confirmPassword();
            }
        });

        // ページ読み込み時に初期化
        window.onload = init;
    </script>
</body>
</html>
