<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Campus Navigator
    </title>

    <style>
        body {

            margin: 0;
            overflow: hidden;
            background: #101820;
            font-family: sans-serif;

        }

        canvas {

            display: block;

        }

        #ui {

            position: absolute;

            top: 20px;
            left: 20px;

            display: flex;
            flex-direction: column;

            gap: 8px;

            z-index: 100;

        }

        .floor-button {

            background: #101820;

            border: 1px solid #69A0FF;

            color: #69A0FF;

            border-radius: 8px;

            padding: 8px 12px;

            cursor: pointer;

            transition: .2s;

        }

        .floor-button:hover {

            background: #69A0FF;
            color: white;

        }

        .floor-button.active {

            background: #69A0FF;
            color: white;

            box-shadow:
                0 0 12px #69A0FF;

        }
    </style>

    <script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

</head>

<body>

    <div id="ui">
    </div>

    <script type="module" src="./main.js">
    </script>

</body>

</html>
